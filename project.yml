name: HorongHorong
options:
  bundleIdPrefix: com.horonghorong
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  HotKey:
    url: https://github.com/soffes/HotKey.git
    from: "0.2.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
  # 컴패니언 대화를 앱 안에서 직접 돌리는 MLX. swift-huggingface / swift-transformers 는
  # mlx-swift-lm 이 가중치와 토크나이저를 가져올 때 쓰는 짝이라 함께 붙인다.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"
  # 로컬 패키지 — AI 커널. 앱 타깃에 의존하지 않아 평가를 앱 빌드 없이 돌릴 수 있다.
  HorongAI:
    path: HorongAI

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.9"
    CURRENT_PROJECT_VERSION: "16"

schemes:
  HorongHorong:
    build:
      targets:
        HorongHorong: all
    test:
      targets:
        - HorongHorongTests
    run:
      config: Debug
    archive:
      config: Release
  HorongHorongAppStore:
    build:
      targets:
        HorongHorongAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HorongHorong:
    type: application
    platform: macOS
    configFiles:
      Debug: HorongHorong/Config/Base.xcconfig
      Release: HorongHorong/Config/Base.xcconfig
    sources:
      - path: HorongHorong
        excludes:
          - "**/*.entitlements"
          - "Info-AppStore.plist"
      - path: Assets/companion
        type: folder
        buildPhase: resources
      - path: Assets/overview
        type: folder
        buildPhase: resources
      - path: HorongHorong/Resources/Guide
        buildPhase: resources
      - path: USER_GUIDE.md
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: HorongHorong/Info.plist
        CODE_SIGN_ENTITLEMENTS: HorongHorong/HorongHorong.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.horonghorong.app
        PRODUCT_NAME: 호롱호롱
        EXECUTABLE_NAME: HorongHorong
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "YES"
        # ad-hoc("-") 서명은 안정적인 신원이 없어 macOS 의 권한 장부(TCC)가 허용을 기억하지
        # 못한다. 그래서 미리알림 권한을 날짜 바꿀 때마다 다시 묻는다. 개발 인증서로 서명하면
        # 신원이 고정되어 한 번 허용한 것이 유지된다.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: WSG3ZHK35V
        ENABLE_APP_SANDBOX: "NO"
        OTHER_SWIFT_FLAGS: "$(inherited) -DDIRECT_DISTRIBUTION"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: HotKey
      - package: Sparkle
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: HorongAI
        product: HorongAI
      - package: HorongAI
        product: HorongAIMLX
      - sdk: HealthKit.framework
    postCompileScripts:
      - name: Copy News Runner Resources
        script: |
          set -euo pipefail
          SRC="${PROJECT_DIR}/Agents/news_report"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/news_report"
          if [ ! -d "$SRC" ]; then
            echo "warning: News runner source not found: $SRC"
            exit 0
          fi
          mkdir -p "$DST"
          rsync -a --delete \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'data' \
            "$SRC/" "$DST/"

  HorongHorongAppStore:
    type: application
    platform: macOS
    configFiles:
      Debug: HorongHorong/Config/Base.xcconfig
      Release: HorongHorong/Config/Base.xcconfig
    sources:
      - path: HorongHorong
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Services/AppUpdate/**"
      - path: Assets/companion
        type: folder
        buildPhase: resources
      - path: Assets/overview
        type: folder
        buildPhase: resources
      - path: HorongHorong/Resources/Guide
        buildPhase: resources
      - path: USER_GUIDE.md
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: HorongHorong/Info-AppStore.plist
        CODE_SIGN_ENTITLEMENTS: HorongHorong/HorongHorong.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.horonghorong.app
        PRODUCT_NAME: 호롱호롱
        EXECUTABLE_NAME: HorongHorong
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_APP_SANDBOX: "YES"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: HotKey
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: HorongAI
        product: HorongAI
      - package: HorongAI
        product: HorongAIMLX
      - sdk: HealthKit.framework
    postCompileScripts:
      - name: Copy News Runner Resources
        script: |
          set -euo pipefail
          SRC="${PROJECT_DIR}/Agents/news_report"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/news_report"
          if [ ! -d "$SRC" ]; then
            echo "warning: News runner source not found: $SRC"
            exit 0
          fi
          mkdir -p "$DST"
          rsync -a --delete \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'data' \
            "$SRC/" "$DST/"

  HorongHorongTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HorongHorongTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horonghorong.app.tests
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/호롱호롱.app/Contents/MacOS/HorongHorong"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: HorongHorong
